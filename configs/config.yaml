defaults:
  - model: hier_fsq
  - data: r0_v2_1
  - _self_

run_name: hier-fsq-n10-v2048

train:
  out_dir: ${oc.env:VQLA_OUT,outputs}/${run_name}
  run_name: ${run_name}
  steps: 300000
  batch_size: 256          # per process
  lr: 3.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.01
  betas: [0.9, 0.95]
  warmup_steps: 2000
  schedule: cosine         # cosine | constant
  grad_clip: 1.0
  num_workers: 10
  samples_per_episode: 8
  seed: 0
  log_every: 100
  eval_every: 10000
  ckpt_every: 5000
  eval_batch_size: 1024
  mixed_precision: bf16
  quantizer_warmup_steps: 0      # >0 trains without the quantizer for that many steps first

comet:
  mode: auto               # auto | online | offline | disabled
  workspace: dont4rootme
  project: hier-action-tokenizer
  tags: [hier-tokenizer, unified-119]

hydra:
  run:
    dir: ${train.out_dir}/hydra
  job_logging:
    root:
      level: INFO
