defaults:
  - model: hier_vq
  - data: r0_v2_1
  - _self_

run_name: hier-vq-n10-v2048

train:
  out_dir: ${oc.env:VQLA_OUT,outputs}/${run_name}
  run_name: ${run_name}
  steps: 300000
  batch_size: 256          # per process
  lr: 3.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.01
  betas: [0.9, 0.95]
  warmup_steps: 2000
  schedule: cosine         # cosine | constant
  grad_clip: 1.0
  num_workers: 10
  samples_per_episode: 8
  seed: 0
  log_every: 100
  eval_every: 10000
  ckpt_every: 5000
  snapshot_every: 20000    # exported weights kept every N steps; best/ holds the best evaluation
  eval_batch_size: 1024
  mixed_precision: bf16
  # The quantizer must not be switched on from step 0: it collapses to a single code and the encoder follows it
  # into a constant. Training the plain autoencoder first fixes this (see docs/runs.md, 2026-09-12).
  quantizer_warmup_steps: 10000
  no_decay_keywords: []    # e.g. [from_code, to_code]: exempt the code projections from weight decay
  # Per-chunk augmentation of input and target alike, off by default (docs/runs.md, OOD results 2026-09-21).
  augment:
    amplitude_prob: 0.0
    amplitude_range: [0.5, 1.5]
    noise_prob: 0.0
    noise_sigma: 0.02
    group_drop_prob: 0.0
  # Relaxed distortion measure on the decoder's Jacobian (IRVAE, ICLR 2022): keeps the latent geometry isotropic.
  isometry:
    weight: 0.0
    subbatch: 64
    epsilon: 0.01
    alpha_jitter: 0.2
    warmup_steps: 0
    every: 1

comet:
  mode: auto               # auto | online | offline | disabled
  workspace: dont4rootme
  project: hier-action-tokenizer
  tags: [hier-tokenizer, unified-119]

hydra:
  run:
    dir: ${train.out_dir}/hydra
  job_logging:
    root:
      level: INFO
