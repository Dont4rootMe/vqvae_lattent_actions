defaults:
  - hier_base
  - _self_

quantizer:
  type: vq
  vocab_size: 2048
  # A narrow code beats a wide one here: at an identical 6000-step budget width 4 gave RMSE 0.11598 and used
  # 95 of 110 bits, width 64 gave 0.14094 and 84 bits (docs/runs.md, 2026-09-12).
  code_dim: 4
  commitment: 0.25
  decay: 0.99
  # Anchors for the code scale, at most one. Euclidean matching is unstable: the code norm grows without bound
  # (9x by step 11k in one run, from step 27k in another) and the codebook collapses. Cosine held the scale
  # through a full 40k schedule at 10 tokens, RMSE 0.07443 against 0.0806 for ActionCodec (docs/runs.md, 2026-09-14).
  cosine: true             # match directions, drop magnitude
  max_restarts_per_step: 64  # a healthy run had 735 codes under the restart floor on every step
  squash: false            # tanh-bound the code, keep magnitude (not validated)
