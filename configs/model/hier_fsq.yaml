horizon: 10
max_horizon: 64
num_tokens: 10             # N tokens per chunk
dim: 256
heads: 8
free_queries: 4            # per-step queries on top of one query per semantic group
enc_step_layers: 2
enc_time_layers: 4
enc_latent_layers: 4
dec_latent_layers: 2
dec_layers: 4
ff_mult: 4
dropout: 0.0
value_embedding: mlp
group_weights: null
quantizer:
  type: fsq
  levels: [8, 8, 8, 4]     # V = 2048 codes = 11 bits per token
  commitment: 0.25
