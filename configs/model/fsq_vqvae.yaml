# Default configuration for the FSQ-based VQ-VAE model.
_target_: vqvae_latent_actions.models.FSQVQVAE
action_dim: null
latent_dim: 256
hidden_dim: 256
num_heads: 4
num_encoder_layers: 6
num_decoder_layers: 6
fsq_levels: [8, 8, 4, 4]
commitment_cost: 0.25
dropout: 0.1
max_seq_len: 100
clip_range: 1.0
use_projection_encoder: true
use_projection_decoder: true
